version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: whale-scanner-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whale_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-whale_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/whale_scanner_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whale_scanner} -d ${POSTGRES_DB:-whale_scanner}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whale-network

  # Main Web Application & API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whale-scanner-api
    restart: unless-stopped
    command: python api_server.py
    environment:
      # Database configuration
      DB_TYPE: ${DB_TYPE:-postgresql}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-whale_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-whale_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}

      # Application settings
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}

      # Tradier settings
      TRADIER_API_KEY: ${TRADIER_API_KEY:-}
      TRADIER_ACCOUNT_ID: ${TRADIER_ACCOUNT_ID:-}
      TRADIER_SANDBOX: ${TRADIER_SANDBOX:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whale-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
    driver: local

networks:
  whale-network:
    driver: bridge
