version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: whale-scanner-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whale_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-whale_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whale_scanner} -d ${POSTGRES_DB:-whale_scanner}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whale-network

  # Main Web Application
  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whale-scanner-web
    restart: unless-stopped
    command: python web_app.py
    environment:
      # Database configuration
      DB_TYPE: ${DB_TYPE:-postgresql}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-whale_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-whale_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}

      # Application settings
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      WEB_HOST: ${WEB_HOST:-0.0.0.0}
      WEB_PORT: ${WEB_PORT:-5000}

      # Data provider (ibkr or tradier)
      DATA_PROVIDER: ${DATA_PROVIDER:-tradier}

      # IBKR settings (if using IBKR)
      IBKR_HOST: ${IBKR_HOST:-host.docker.internal}
      IBKR_PORT: ${IBKR_PORT:-7497}
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-1}

      # Tradier settings (if using Tradier)
      TRADIER_API_KEY: ${TRADIER_API_KEY:-}
      TRADIER_ACCOUNT_ID: ${TRADIER_ACCOUNT_ID:-}
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whale-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Configuration UI
  config-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whale-scanner-config-ui
    restart: unless-stopped
    command: python web_config_ui.py
    environment:
      # Database configuration
      DB_TYPE: ${DB_TYPE:-postgresql}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-whale_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-whale_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}

      # Application settings
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      CONFIG_UI_HOST: ${CONFIG_UI_HOST:-0.0.0.0}
      CONFIG_UI_PORT: ${CONFIG_UI_PORT:-5001}
    ports:
      - "${CONFIG_UI_PORT:-5001}:5001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whale-network

  # CLI Scanner (optional - can be run manually)
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whale-scanner-cli
    restart: "no"
    command: python scanner.py --continuous --interval 60
    environment:
      # Database configuration
      DB_TYPE: ${DB_TYPE:-postgresql}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-whale_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-whale_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}

      # Data provider
      DATA_PROVIDER: ${DATA_PROVIDER:-tradier}

      # IBKR settings
      IBKR_HOST: ${IBKR_HOST:-host.docker.internal}
      IBKR_PORT: ${IBKR_PORT:-7497}
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-1}

      # Tradier settings
      TRADIER_API_KEY: ${TRADIER_API_KEY:-}
      TRADIER_ACCOUNT_ID: ${TRADIER_ACCOUNT_ID:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whale-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - scanner  # Only start with: docker-compose --profile scanner up

volumes:
  postgres_data:
    driver: local

networks:
  whale-network:
    driver: bridge
