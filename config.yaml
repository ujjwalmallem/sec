# Whale Options Scanner Configuration

# Data Source Selection
data_source:
  provider: "tradier"         # Options: "ibkr" or "tradier"

# IBKR Connection Settings
ibkr:
  tws:
    host: "127.0.0.1"
    port: 7497              # 7497 for TWS paper, 7496 for TWS live, 4002 for Gateway
    client_id: 1
    readonly: true

  # REST API (if using IBKR Client Portal)
  rest_api:
    base_url: "https://localhost:5000/v1/api"
    use_rest: false

# Tradier Connection Settings (RECOMMENDED - No TWS needed!)
tradier:
  api_token: "YapJSqXqDZ5ui8HtoP7QEyIX7CIk"    # Your Tradier API token
  sandbox: true                                  # true = sandbox, false = production
  account_id: "VA31706838"                       # Your Tradier account ID

# PostgreSQL Database Settings
postgres:
  enabled: true                    # Enable PostgreSQL storage
  host: "localhost"
  port: 5432
  database: "whale_scanner"
  user: "postgres"
  password: ""                     # Set your PostgreSQL password
  # For production, use environment variable: ${POSTGRES_PASSWORD}

# Watchlist - Symbols to monitor
watchlist:
  symbols:
    - "SPY"
    - "QQQ"
    - "AAPL"
    - "NVDA"
    - "TSLA"
    - "AMD"
    - "MSFT"
    - "GOOGL"
    - "META"
    - "AMZN"

  # Scan all S&P 500 (set to true to scan all)
  scan_sp500: false
  scan_nasdaq100: false

# Core Whale Filters (Applied in Order)
whale_filters:
  # 1. Liquidity Gate
  liquidity_gate:
    min_volume: 500000      # Volume > 500K contracts
    min_oi: 100000          # OI > 100K per expiry
    min_oi_per_strike: 5000 # Minimum OI per strike

  # 2. Anomaly Gate - P/C Ratio
  anomaly_gate:
    pc_deviation_threshold: 1.5  # P/C deviates >1.5σ from 20-day avg
    pc_lookback_days: 20
    pc_bullish_threshold: 0.7    # <0.7 = bullish
    pc_bearish_threshold: 1.3    # >1.3 = bearish
    pc_extreme_low: 0.5          # <0.5 = extreme bullish
    pc_extreme_high: 1.5         # >1.5 = extreme bearish
    pc_whale_threshold: 0.3      # ≤0.3 = whale activity

  # 3. Conviction Gate - Volume vs OI
  conviction_gate:
    volume_vs_avg_multiplier: 2.0     # Volume > 2x avg
    volume_vs_10d_avg_multiplier: 3.0 # Today vol > 3x of 10-day avg
    oi_delta_threshold: 25000         # OI change > 25K
    oi_growth_required: true          # OI must increase in flow direction

  # 4. Volatility Gate - IV Rank
  volatility_gate:
    ivr_expensive: 80          # IVR > 80 = expensive vol
    ivr_cheap: 20              # IVR < 20 = cheap vol
    ivr_extreme_high: 90       # IVR > 90 = sell premium
    ivr_extreme_low: 10        # IVR < 10 = buy calendars
    ivr_lookback_days: 252     # 1 year for IV rank calculation

# Custom Scanner Conditions
custom_scanner:
  volume_threshold: 2.0           # total_volume > 2 * avg_20d_volume
  pc_deviation_multiplier: 1.5    # abs(pc_ratio - avg_pc_20d) > 1.5 * stddev_pc
  oi_change_threshold: 10000      # oi_change > 10000
  iv_rank_high: 80                # iv_rank > 80
  iv_rank_low: 20                 # iv_rank < 20

# Volume Analysis
volume_analysis:
  lookback_days_10: 10
  lookback_days_20: 20
  high_volume_low_oi_flag: true   # Flag trades with high vol but low OI (noise)

# Skew Analysis
skew_analysis:
  fear_threshold: 10              # Put IV > Call IV by 10% = Fear
  inverted_skew_threshold: -5     # Call IV > Put IV = Greed

# IV Term Structure
iv_term_structure:
  check_inversion: true           # Alert on inverted term structure
  near_far_threshold: 0.05        # 5% threshold for inversion

# Whale Combo Signals (High Conviction)
whale_combos:
  strong_bull:
    pc_ratio_max: 0.7
    call_volume_min_multiplier: 2.0
    call_oi_increasing: true
    ivr_max: 30

  institutional_crash_protection:
    pc_ratio_min: 1.3
    put_volume_spike_multiplier: 3.0
    put_oi_increasing: true
    ivr_min: 90

  retail_fomo:
    pc_ratio_max: 0.3
    volume_multiplier: 5.0
    oi_change_max: 1000           # No significant OI change
    fade_signal: true             # Fade this with iron condors

# Scanning Parameters
scanning:
  interval_seconds: 60            # Scan every 60 seconds
  expirations_to_scan:
    - 0                           # 0 DTE
    - 1                           # 1 DTE
    - 2                           # 2 DTE
    - 7                           # 1 week
    - 14                          # 2 weeks
    - 30                          # 1 month
    - 60                          # 2 months

  strikes_range: 20               # Number of strikes above/below current price

# Data Storage
storage:
  database_path: "data/whale_scanner.db"
  enable_historical_storage: true
  retention_days: 90

# Alerts and Notifications
alerts:
  enable_console: true
  enable_file_logging: true
  log_file: "logs/whale_scanner.log"

  # Telegram (optional)
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

  # Email (optional)
  email:
    enabled: false
    smtp_server: ""
    smtp_port: 587
    username: ""
    password: ""
    to_addresses: []

# Risk Management
risk_management:
  max_position_size: 10000        # Max $ per position
  max_daily_trades: 20

# Logging
logging:
  level: "INFO"                   # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
